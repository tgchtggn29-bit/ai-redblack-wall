# ===== vote.wqai.ltd 反代 + 限流 =====
# 放到 /etc/nginx/conf.d/vote.wqai.ltd.conf
# 纯 HTTP 版；跑 certbot --nginx 后会自动补 443 与 80->443 跳转
# 注意：limit_req_zone / limit_conn_zone 是 http 级指令，必须写在 server 之外

limit_req_zone  $binary_remote_addr zone=vote_rl:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=vote_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name vote.wqai.ltd;

    client_max_body_size 320k;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location / {
        limit_req  zone=vote_rl burst=30 nodelay;
        limit_conn vote_conn 30;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # 静态资源长缓存
    location ~* \.(png|jpg|jpeg|webp|svg|gif|ico|mp3|woff2?)$ {
        limit_req  zone=vote_rl burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
